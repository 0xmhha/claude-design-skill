# Dependabot configuration — auto-update GitHub Actions versions only.
#
# This repo has no language-specific package manifests (no package.json,
# no requirements.txt — the tests use stdlib only). The only ecosystem
# Dependabot watches is the action versions pinned in
# .github/workflows/sanitizers.yml.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "actions/*"
